name: Docker stack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POSTGRES_PASSWORD: ci-only-render-postgres-password
      JWT_SECRET: ci-only-render-jwt-secret-never-use-outside-ci-2026
      DEMO_PASSWORD: ci-only-render-demo-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Blueprint against the official Render schema
        run: |
          python -m pip install 'PyYAML>=6,<7' 'jsonschema>=4,<5'
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen
          import jsonschema
          import yaml

          with urlopen("https://render.com/schema/render.yaml.json", timeout=30) as response:
              schema = json.load(response)
          blueprint = yaml.safe_load(Path("render.yaml").read_text())
          jsonschema.Draft202012Validator(schema).validate(blueprint)
          print("Render Blueprint matches the official JSON schema")
          PY
      - name: Validate the local Render equivalent
        run: docker compose --env-file /dev/null -f compose.render.yaml config --quiet

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete stack
        run: ./scripts/docker-up.sh
      - name: Full backend regression and concurrency (isolated PostgreSQL schemas)
        run: docker compose exec -T backend python -m pytest -q
      - name: Assistant evaluation (isolated PostgreSQL schema)
        run: docker compose exec -T backend python -m eval.evaluate_assistant
      - name: Smoke test through frontend and PostgreSQL persistence
        run: docker compose exec -T backend python - < scripts/compose_smoke.py
      - name: Restart with the existing database
        run: |
          docker compose down
          ./scripts/docker-up.sh
          docker compose exec -T backend python - < scripts/compose_smoke.py
      - name: Diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down

  single-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-web-jwt-secret-never-use-outside-ci-2026
      DEMO_PASSWORD: ci-only-web-demo-password-2026
      ZUP_API_TOKEN: ci-only-web-jwt-secret-never-use-outside-ci-2026
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jana
          POSTGRES_DB: jana
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jana -d jana"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the root web image
        run: docker build -t digital-hr-web:ci .
      - name: Start with external PostgreSQL and verify persistence across restart
        run: |
          docker run -d --name digital-hr-web-ci --network host \
            -e DATABASE_URL=postgresql://jana:ci-only-postgres-password@127.0.0.1:5432/jana \
            -e JWT_SECRET -e DEMO_PASSWORD -e ZUP_API_TOKEN \
            -e PORT=10000 -e RENDER_EXTERNAL_URL=http://localhost:10000 \
            -v digital_hr_web_ci_mocks:/var/data digital-hr-web:ci
          wait_web() {
            for attempt in $(seq 1 60); do
              if curl --silent --fail http://localhost:10000/api/health >/dev/null; then
                return 0
              fi
              sleep 1
            done
            docker logs digital-hr-web-ci
            return 1
          }
          wait_web
          docker exec -i -e API_BASE_URL=http://127.0.0.1:10000/api digital-hr-web-ci python - < scripts/compose_smoke.py
          docker restart digital-hr-web-ci
          wait_web
          docker exec -i -e API_BASE_URL=http://127.0.0.1:10000/api digital-hr-web-ci python - < scripts/compose_smoke.py
      - name: Diagnostics
        if: failure()
        run: docker logs digital-hr-web-ci
      - name: Stop the web container
        if: always()
        run: docker rm -f digital-hr-web-ci
