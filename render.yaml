# Render uses Blueprints, not Docker Compose. Local equivalent: compose.render.yaml.
# Paid resources; review the estimate in Render before deploying.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: digital-hr-web
    runtime: docker
    repo: https://github.com/bshakaryan/digital-hr.git
    branch: main
    region: frankfurt
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: digital-hr-mocks
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-hr-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: ZUP_MODE
        value: mock
      - key: DOCUMENTOLOG_MODE
        value: mock
      - key: LLM_PROVIDER
        value: disabled
      - key: DATA_DIR
        value: /var/data

databases:
  - name: digital-hr-postgres
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: jana
    user: jana
    diskSizeGB: 1
    # Only Render's private network can connect; no public database access.
    ipAllowList: []
