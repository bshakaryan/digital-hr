# Render uses Blueprints, not Docker Compose. Local equivalent: compose.render.yaml.
# Free, temporary demo: Postgres expires after 30 days; mock files are ephemeral.
# Optional paid deployment with a persistent mock disk: render.paid.yaml.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: digital-hr-web
    runtime: docker
    repo: https://github.com/bshakaryan/digital-hr.git
    branch: main
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-hr-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: ZUP_MODE
        value: mock
      - key: DOCUMENTOLOG_MODE
        value: mock
      - key: LLM_PROVIDER
        value: disabled
      - key: DATA_DIR
        value: /var/data

databases:
  - name: digital-hr-postgres
    region: oregon
    plan: free
    postgresMajorVersion: "17"
    databaseName: jana
    user: jana
    # Only Render's private network can connect; no public database access.
    ipAllowList: []
